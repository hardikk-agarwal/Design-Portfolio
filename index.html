<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const parameter = new URLSearchParams(window.location.search).get('clawpilotTheme')
        let saved
        try { saved = localStorage.getItem('portfolio-theme') } catch {}
        const preference = parameter || saved
        const theme = ['light', 'dark'].includes(preference)
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        // The app restores scroll itself; the home page opens on the cover's viewfinder, so its black and the clear header
        // are painted before the app loads (the cover clears data-boot once it is up).
        history.scrollRestoration = 'manual'
        if (!/^#(?:work|ai|about|resume|exhibition|my-story|my-approach|selected-work|built-with-ai|experience|beyond-work|contact)(?:\/|$)/.test(location.hash)) {
          document.documentElement.dataset.boot = ''
          document.documentElement.dataset.headerTone = 'clear'
        }
      })()
    </script>
    <style>
      html[data-boot] { background: #030403; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="I'm Hardik Agarwal, a product designer at Microsoft in Hyderabad, India. Case studies from Microsoft Store, Windows and Copilot, and apps I built with AI." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://hardikk-agarwal.github.io/Design-Portfolio/" />
    <!-- Link previews (LinkedIn, email, chat) need absolute URLs; public/og-image.jpg is rendered from the cover photo. -->

    <meta property="og:site_name" content="Hardik Agarwal" />
    <meta property="og:title" content="Hardik Agarwal, product designer at Microsoft" />
    <meta property="og:description" content="Case studies from Microsoft Store, Windows and Copilot, and the apps and tools I built with AI." />
    <meta property="og:url" content="https://hardikk-agarwal.github.io/Design-Portfolio/" />
    <meta property="og:image" content="https://hardikk-agarwal.github.io/Design-Portfolio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hardik Agarwal on a green bench, with his name and role: product designer at Microsoft" />
    <meta name="twitter:card" content="summary_large_image" />
