<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const parameter = new URLSearchParams(window.location.search).get('clawpilotTheme')
        let saved
        try { saved = localStorage.getItem('portfolio-theme') } catch {}
        const preference = parameter || saved
        const theme = ['light', 'dark'].includes(preference)
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hardik Agarwal is a product designer at Microsoft. He grew up customizing Windows and now helps design it, working across identity, developer platforms and AI." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141414'/%3E%3Ctext x='14' y='23' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='19' fill='%23eeeeec'%3Eh%3C/text%3E%3Ccircle cx='23' cy='21' r='2.6' fill='%23f0587a'/%3E%3C/svg%3E" />
    <title>Hardik Agarwal | Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Hardik Agarwal, product designer at Microsoft. Contact <a href="mailto:madebyhardik@gmail.com">madebyhardik@gmail.com</a>. JavaScript is required for this portfolio.</p></noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
